<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Selectors</title>
</head>
<body>

    <div class="first">
        Hello JavaScript
    </div>

    <script>
        alert("I am going to learn JS");

        let container = document.getElementsByClassName("first");

        console.log(container);
        console.log(container[0].innerHTML);
    </script>

</body>
</html>
